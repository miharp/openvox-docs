---
title: OpenVox Documentation
description: Documentation for various OpenVox Projects.
url: https://docs.openvoxproject.org

logo: /assets/images/HexagonSticker.png

timezone: UTC

theme: jekyll-vitepress-theme
plugins:
  - jekyll-vitepress-theme
  - jekyll-tabs

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    block:
      line_numbers: false

jekyll_vitepress:
  branding:
    logo:
      default: 'https://github.com/voxpupuli/logos/blob/master/images/OpenVox/Sticker/HexagonSticker.svg?raw=true'
      alt: OpenVox Automation Framework
  # Social-card image for Open Graph / Twitter tags. Falls back to `logo`
  # without this, but width/height are only emitted when set here.
  seo:
    image:
      path: /assets/images/HexagonSticker.png
      alt: OpenVox Documentation
      width: 1200
      height: 630
  # Disabled as it adds extra size to generated HTML pages.
  copy_page:
    enabled: false
  # Disable previous/next links at the bottom of the page as
  # they don't match the order of the outlines defined in
  # `_data/nav/*.yaml` and thus cause confusion.
  doc_footer:
    enabled: false
  github_sponsor:
    enabled: true
    user: voxpupuli


collections_dir: docs
# Collections and their front matter defaults are registered at build time
# from _data/products.yml (see lib/openvox_docs/versioned_docs.rb), so a new
# version or product needs no entries here.

# Ignores all legacy files present in the root directory as of
# commit 09952f27 (with the exception of LICENSE). As older files
# are cleaned up, this exclusion list should shrink.
exclude:
  - bin
  - CNAME
  - CODEOWNERS
  - config.ru
  - CONTRIBUTING.md
  - externalsources
  - Gemfile
  - Gemfile.lock
  - lib
  - MAINTAINING.md
  - puppet_docs.gemspec
  - Rakefile
  - README_WRITING.markdown
  - README.markdown
  - util
  - vendor
  - WORKFLOW.md
  - WORKFLOW_reference.md
