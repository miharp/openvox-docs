---
name: Markdown Lint

on:
  pull_request: {}
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: List tracked Markdown files
        id: tracked-markdown
        shell: bash
        # Lint git-tracked files only. This lints each page's source once and
        # skips what the build generates: the assembled version directories,
        # the `_latest` symlinks, and the reference docs, all gitignored.
        run: |
          {
            echo 'files<<EOF'
            git ls-files '*.md' '*.markdown'
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"
      - name: Lint tracked Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: ${{ steps.tracked-markdown.outputs.files }}
