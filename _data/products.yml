# Single source of truth for products and their documentation versions.
#
# The build derives everything else from this file (lib/openvox_docs/versioned_docs.rb):
# the Jekyll collections and their defaults, the `docs/_<product>_latest`
# symlinks, the sidebar's nav map, the product bar's active state, the version
# selector, and the outdated-version banner. `rake references:all` reads each
# version's `ref` to build the generated reference pages.
#
# Each product's pages live in docs/_<product>/ (the newest version) and
# docs/_<product>_versions/<id>/ (an older version's copies of the pages that
# differ). The build assembles each version's collection from them. See
# MAINTAINING.md for the editing rules.
#
# Keyed by product id; insertion order is the display order. Each product has:
#   - label:          display name for the UI (e.g. "OpenVox").
#   - latest:         the version `id` that `/<product>/latest/` serves. Changing
#                     it is how a new major is promoted at GA.
#   - references:     the rake task that (re)generates this product's reference
#                     pages. Omit for authored-only products.
#   - single_version: (optional) true when the product has one version whose
#                     collection is `_<product>_latest` itself (e.g. OpenVox
#                     Containers); no symlink or version picker is made for it.
#   - versions:       list of version entries, newest first, each with:
#       - id:         short version id (e.g. "8x"). The label ("8.x"), collection
#                     (`_openvox_8x`), and URL base (`/openvox/8.x/`) are derived
#                     from it; set `label`, `collection`, or `base` to override.
#       - frozen:     true once the version is no longer maintained: it is
#                     assembled from its own directory alone, which
#                     `rake docs:freeze` fills with a full snapshot.
#       - ref:        (products with a `references:` task only) what to build the
#                     reference pages from. Either:
#                       - a series, e.g. "8.x": resolved at build time to the
#                         newest stable (non-prerelease) tag in that series, so
#                         the current stable version picks up point releases with
#                         no docs change. The series bound is what makes this
#                         safe: an unbounded "newest stable" is global and would
#                         jump majors once a new major ships. Use this for the
#                         current stable version of a product.
#                       - an exact tag, e.g. "9.0.0-beta2" or "8.28.1": built
#                         verbatim. Use this for prereleases (a series never
#                         resolves to one) and for a frozen older major, which
#                         keeps its final tag so the collection stays
#                         reproducible.

openvox:
  label: OpenVox
  latest: 8x
  references: references:openvox
  versions:
    - id: 9x
      ref: "9.0.0-rc1"
    - id: 8x
      ref: "8.x"

openfact:
  label: OpenFact
  latest: 5x
  references: references:openfact
  versions:
    - id: 6x
      ref: "6.0.0"
    - id: 5x
      ref: "5.x"

openbolt:
  label: OpenBolt
  latest: 5x
  references: references:openbolt
  versions:
    - id: 5x
      ref: "5.x"

openvox-server:
  label: OpenVox Server
  latest: 8x
  versions:
    - id: 9x
    - id: 8x

openvoxdb:
  label: OpenVoxDB
  latest: 8x
  versions:
    - id: 9x
    - id: 8x

ecosystem:
  label: Ecosystem
  latest: 8x
  versions:
    - id: 8x

openvox-containers:
  label: OpenVox Containers
  latest: latest
  single_version: true  # no numbered collection, so no version picker (see header)
  versions:
    - id: latest
      collection: _openvox-containers_latest
      base: /openvox-containers/latest/
